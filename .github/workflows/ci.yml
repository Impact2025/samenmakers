name: CI

on:
  push:
    branches: [master, "feat/**"]
  pull_request:
    branches: [master]

jobs:
  quality:
    name: Type-check & Lint & Test
    runs-on: ubuntu-latest

    env:
      SKIP_ENV_VALIDATION: "true"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      NEXT_PUBLIC_PUSHER_KEY: "test-key"
      NEXT_PUBLIC_PUSHER_CLUSTER: "eu"
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: "pk_test_placeholder"
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: "test-vapid-key"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - run: npm ci

      - name: Beveiligingsaudit (productie)
        run: npm audit --omit=dev --audit-level=high

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          # Required for build — use dummy values
          DATABASE_URL: "postgresql://build:placeholder@localhost:5432/build"
          DATABASE_URL_UNPOOLED: "postgresql://build:placeholder@localhost:5432/build"
          AUTH_SECRET: "012345678901234567890123456789012345678901234567890123456789"
          AUTH_GOOGLE_ID: "placeholder"
          AUTH_GOOGLE_SECRET: "placeholder"
          AUTH_LINKEDIN_ID: "placeholder"
          AUTH_LINKEDIN_SECRET: "placeholder"
          PUSHER_APP_ID: "placeholder"
          PUSHER_SECRET: "placeholder"
          STRIPE_SECRET_KEY: "sk_test_placeholder"
          STRIPE_WEBHOOK_SECRET: "whsec_placeholder"
          STRIPE_PRO_PRICE_ID: "price_placeholder"
          RESEND_API_KEY: "re_placeholder"
          RESEND_FROM_EMAIL: "test@example.com"
          UPSTASH_REDIS_REST_URL: "https://placeholder.upstash.io"
          UPSTASH_REDIS_REST_TOKEN: "placeholder"
          CRON_SECRET: "0123456789012345678901234567890123456789"
